[package]
name = "esp32-board-checker"
version = "0.1.0"
edition = "2021"
description = "ESP32 Board Checker - scan serial ports and inspect ESP chips"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "backend-default", "renderer-femtovg", "compat-1-18"] }
serialport = "4.10"
espflash = { version = "4.7", default-features = false, features = ["serialport"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
